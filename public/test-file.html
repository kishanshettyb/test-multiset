<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three.js Navigation Test</title>

<style>
html,body,#app{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101216;
}
#info{
  position:fixed;
  top:16px;
  left:16px;
  right:16px;
  z-index:10;
  color:#fff;
  background:rgba(0,0,0,.75);
  padding:14px 16px;
  border-radius:14px;
  font:14px Arial,sans-serif;
  box-sizing:border-box;
}
#info b{
  display:block;
  font-size:18px;
  margin-bottom:5px;
}
#buttons{
  position:fixed;
  bottom:18px;
  left:0;
  right:0;
  z-index:10;
  text-align:center;
}
button{
  padding:13px 20px;
  border:0;
  border-radius:14px;
  font-weight:700;
  cursor:pointer;
}
#error{
  margin-top:8px;
  color:#ff7777;
  white-space:pre-wrap;
}
</style>

<!-- IMPORTANT: maps the bare "three" import used by OrbitControls -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js"
  }
}
</script>
</head>

<body>
<div id="app"></div>

<div id="info">
  <b>Indoor Navigation — Three.js Test</b>
  <div id="status">Loading Three.js...</div>
  <div id="error"></div>
</div>

<div id="buttons">
  <button id="reset">Reset</button>
</div>

<script type="module">
import * as THREE from "three";

const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");

try {

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101216);

const camera = new THREE.PerspectiveCamera(
  55,
  window.innerWidth / window.innerHeight,
  0.01,
  1000
);

camera.position.set(7, 7, 10);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.getElementById("app").appendChild(renderer.domElement);

/* Simple camera controls (no OrbitControls dependency) */
let isDragging = false;
let lastX = 0;
let lastY = 0;
let yaw = 0.55;
let pitch = 0.65;
let distance = 13;

function updateCamera() {
  const target = new THREE.Vector3(0, 0, 2);
  camera.position.set(
    target.x + Math.sin(yaw) * Math.cos(pitch) * distance,
    target.y + Math.sin(pitch) * distance,
    target.z + Math.cos(yaw) * Math.cos(pitch) * distance
  );
  camera.lookAt(target);
}

renderer.domElement.addEventListener("pointerdown", (e) => {
  isDragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener("pointermove", (e) => {
  if (!isDragging) return;
  yaw -= (e.clientX - lastX) * 0.008;
  pitch += (e.clientY - lastY) * 0.008;
  pitch = Math.max(0.15, Math.min(1.35, pitch));
  lastX = e.clientX;
  lastY = e.clientY;
  updateCamera();
});

renderer.domElement.addEventListener("pointerup", (e) => {
  isDragging = false;
  try { renderer.domElement.releasePointerCapture(e.pointerId); } catch {}
});

renderer.domElement.addEventListener("wheel", (e) => {
  e.preventDefault();
  distance += e.deltaY * 0.01;
  distance = Math.max(4, Math.min(30, distance));
  updateCamera();
}, { passive: false });

updateCamera();

/* Lights */
scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x444444,
    2
  )
);

const light = new THREE.DirectionalLight(
  0xffffff,
  2
);

light.position.set(5, 10, 5);
scene.add(light);

/* Floor */
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(18, 14),
  new THREE.MeshStandardMaterial({
    color: 0x242830,
    roughness: 1
  })
);

floor.rotation.x = -Math.PI / 2;
scene.add(floor);

/* Grid */
const grid = new THREE.GridHelper(
  18,
  36,
  0x555b66,
  0x30343b
);

scene.add(grid);

/*
  TEST ROUTE

  These are only test coordinates.
  Later replace them with your MultiSet route.
*/
const route = [
  new THREE.Vector3(-4, 0.08, 4),
  new THREE.Vector3(-2.8, 0.08, 3.5),
  new THREE.Vector3(-1.6, 0.08, 3),
  new THREE.Vector3(-0.4, 0.08, 2.7),
  new THREE.Vector3(0.8, 0.08, 2.1),
  new THREE.Vector3(1.7, 0.08, 1.2),
  new THREE.Vector3(2.5, 0.08, 0.3)
];

/* Route line */
const routeGeometry =
  new THREE.BufferGeometry().setFromPoints(route);

const routeLine = new THREE.Line(
  routeGeometry,
  new THREE.LineBasicMaterial({
    color: 0x4da3ff,
    transparent: true,
    opacity: 0.35
  })
);

scene.add(routeLine);

/* ==========================================
   ANIMATED NAVIGATION ARROWS
========================================== */

const arrowGroup = new THREE.Group();
scene.add(arrowGroup);

const arrows = [];

function createArrow() {

  const group = new THREE.Group();

  const shaft = new THREE.Mesh(
    new THREE.BoxGeometry(
      0.18,
      0.045,
      0.48
    ),
    new THREE.MeshStandardMaterial({
      color: 0x55c7ff,
      emissive: 0x147ba8,
      emissiveIntensity: 1.5
    })
  );

  /*
    Arrow head points forward along local -Z.
  */
  const head = new THREE.Mesh(
    new THREE.ConeGeometry(
      0.20,
      0.34,
      3
    ),
    new THREE.MeshStandardMaterial({
      color: 0x55c7ff,
      emissive: 0x147ba8,
      emissiveIntensity: 1.5
    })
  );

  head.rotation.x = Math.PI / 2;
  head.position.z = -0.35;

  group.add(shaft);
  group.add(head);

  group.userData.phase =
    Math.random() * Math.PI * 2;

  return group;
}

/*
  Create arrows between every route point.
*/
for (
  let i = 0;
  i < route.length - 1;
  i++
) {

  const start = route[i];
  const end = route[i + 1];

  const direction =
    new THREE.Vector3().subVectors(
      end,
      start
    );

  const distance = direction.length();

  const count =
    Math.max(
      1,
      Math.floor(distance / 0.65)
    );

  for (
    let j = 0;
    j < count;
    j++
  ) {

    const t =
      (j + 0.5) / count;

    const arrow = createArrow();

    arrow.position.lerpVectors(
      start,
      end,
      t
    );

    /*
      Rotate arrow toward next route point.
    */
    arrow.rotation.y =
      Math.atan2(
        direction.x,
        direction.z
      );

    arrowGroup.add(arrow);
    arrows.push(arrow);
  }
}

/* ==========================================
   DESTINATION MARKER
========================================== */

const destination =
  route[route.length - 1];

const marker = new THREE.Group();

marker.position.copy(
  destination
);

scene.add(marker);

/* Marker base */
const base = new THREE.Mesh(
  new THREE.CylinderGeometry(
    0.48,
    0.48,
    0.08,
    48
  ),
  new THREE.MeshStandardMaterial({
    color: 0x42d392,
    emissive: 0x176b4b,
    emissiveIntensity: 1
  })
);

base.position.y = 0.12;
marker.add(base);

/* Pulsing ring */
const ring = new THREE.Mesh(
  new THREE.RingGeometry(
    0.55,
    0.65,
    48
  ),
  new THREE.MeshBasicMaterial({
    color: 0x6fffb2,
    transparent: true,
    opacity: 0.8,
    side: THREE.DoubleSide
  })
);

ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.18;

marker.add(ring);

/* ==========================================
   DESTINATION BOARD
========================================== */

const board = new THREE.Group();

board.position.set(
  destination.x,
  destination.y + 1.15,
  destination.z
);

scene.add(board);

/* Board background */
const panel = new THREE.Mesh(
  new THREE.BoxGeometry(
    1.7,
    0.55,
    0.06
  ),
  new THREE.MeshStandardMaterial({
    color: 0x11151c
  })
);

board.add(panel);

/* Board text */
const canvas =
  document.createElement("canvas");

canvas.width = 1024;
canvas.height = 256;

const ctx =
  canvas.getContext("2d");

ctx.fillStyle = "#11151c";
ctx.fillRect(
  0,
  0,
  1024,
  256
);

ctx.fillStyle = "#55c7ff";
ctx.font = "bold 90px Arial";
ctx.textAlign = "center";
ctx.textBaseline = "middle";

ctx.fillText(
  "LIFT",
  512,
  128
);

const texture =
  new THREE.CanvasTexture(canvas);

const textMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(
    1.55,
    0.39
  ),
  new THREE.MeshBasicMaterial({
    map: texture,
    transparent: true
  })
);

textMesh.position.z = 0.04;

board.add(textMesh);

/* ==========================================
   SIMULATED USER
========================================== */

const user = new THREE.Mesh(
  new THREE.SphereGeometry(
    0.18,
    24,
    24
  ),
  new THREE.MeshStandardMaterial({
    color: 0xffcc55,
    emissive: 0x8a5b00,
    emissiveIntensity: 1.3
  })
);

user.position.copy(
  route[0]
);

user.position.y = 0.3;

scene.add(user);

/* ==========================================
   MOVEMENT
========================================== */

let progress = 0;
let reached = false;

function updateUser(delta) {

  if (reached) {
    return;
  }

  progress += delta * 0.045;

  if (progress >= 1) {

    progress = 1;
    reached = true;

    statusEl.textContent =
      "✓ Destination reached — Lift";

  } else {

    statusEl.textContent =
      "Navigating → Lift";
  }

  const scaled =
    progress * (route.length - 1);

  const index =
    Math.min(
      Math.floor(scaled),
      route.length - 2
    );

  const t =
    scaled - index;

  user.position.lerpVectors(
    route[index],
    route[index + 1],
    t
  );

  user.position.y = 0.3;
}

/* ==========================================
   ANIMATION
========================================== */

const clock =
  new THREE.Clock();

function animate(time) {

  requestAnimationFrame(
    animate
  );

  const delta =
    clock.getDelta();

  /* Arrow animation */
  arrows.forEach(
    (arrow, index) => {

      const phase =
        time * 0.004 +
        index * 0.65 +
        arrow.userData.phase;

      const pulse =
        0.85 +
        Math.sin(phase) * 0.15;

      arrow.scale.set(
        pulse,
        pulse,
        pulse
      );

      arrow.position.y =
        0.08 +
        Math.max(
          0,
          Math.sin(phase)
        ) * 0.035;
    }
  );

  /* Destination pulse */
  if (reached) {

    const p =
      1 +
      Math.sin(time * 0.005) *
      0.22;

    ring.scale.set(
      p,
      p,
      p
    );

    ring.material.opacity =
      0.45 +
      (Math.sin(time * 0.005) + 1) *
      0.2;
  }

  updateUser(delta);

  /*
    Keep board facing camera.
  */
  board.quaternion.copy(
    camera.quaternion
  );


  renderer.render(
    scene,
    camera
  );
}

requestAnimationFrame(
  animate
);

/* Reset */
document.getElementById(
  "reset"
).onclick = () => {

  progress = 0;
  reached = false;

  user.position.copy(
    route[0]
  );

  user.position.y = 0.3;

  ring.scale.set(
    1,
    1,
    1
  );

  statusEl.textContent =
    "Navigating → Lift";
};

/* Resize */
window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);

statusEl.textContent =
  "Three.js loaded — Navigating → Lift";

} catch (error) {

  console.error(error);

  statusEl.textContent =
    "Three.js failed to initialize";

  errorEl.textContent =
    error?.stack ||
    String(error);
}
</script>

</body>
</html>
