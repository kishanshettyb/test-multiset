<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
/>

<title>
  Indoor Navigation Arrow Test
</title>

<style>

html,
body,
#app {

  margin: 0;

  width: 100%;

  height: 100%;

  overflow: hidden;

  background: #111318;

}

#info {

  position: fixed;

  top: 16px;

  left: 16px;

  z-index: 10;

  padding: 14px 18px;

  color: white;

  background:
    rgba(0,0,0,.72);

  border-radius: 14px;

  font-family:
    Arial,
    sans-serif;

}

#info strong {

  display: block;

  font-size: 18px;

  margin-bottom: 5px;

}

#reset {

  position: fixed;

  left: 50%;

  bottom: 24px;

  transform:
    translateX(-50%);

  z-index: 10;

  border: 0;

  padding: 13px 22px;

  border-radius: 14px;

  font-weight: 700;

}

</style>

<script type="importmap">

{

  "imports": {

    "three":
      "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js"

  }

}

</script>

</head>

<body>

<div id="app"></div>

<div id="info">

  <strong>
    Indoor Navigation
  </strong>

  <div id="status">
    Navigating → Lift
  </div>

</div>

<button id="reset">
  Reset
</button>

<script type="module">

import * as THREE
  from "three"


/* =========================================
   SCENE
========================================= */

const scene =
  new THREE.Scene()

scene.background =
  new THREE.Color(
    0x111318
  )


/* =========================================
   CAMERA
========================================= */

const camera =
  new THREE.PerspectiveCamera(
    55,
    window.innerWidth /
      window.innerHeight,
    0.01,
    100
  )

camera.position.set(
  7,
  7,
  10
)


/* =========================================
   RENDERER
========================================= */

const renderer =
  new THREE.WebGLRenderer({
    antialias: true
  })

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
)

renderer.setSize(
  window.innerWidth,
  window.innerHeight
)

renderer.outputColorSpace =
  THREE.SRGBColorSpace

document
  .getElementById("app")
  .appendChild(
    renderer.domElement
  )


/* =========================================
   CAMERA CONTROLS
========================================= */

let yaw = 0.55

let pitch = 0.65

let cameraDistance = 13

let dragging = false

let lastX = 0

let lastY = 0


function updateCamera() {

  const target =
    new THREE.Vector3(
      0,
      0,
      2
    )

  camera.position.set(

    target.x +
      Math.sin(yaw) *
      Math.cos(pitch) *
      cameraDistance,

    target.y +
      Math.sin(pitch) *
      cameraDistance,

    target.z +
      Math.cos(yaw) *
      Math.cos(pitch) *
      cameraDistance

  )

  camera.lookAt(
    target
  )
}


renderer.domElement
  .addEventListener(
    "pointerdown",
    event => {

      dragging = true

      lastX =
        event.clientX

      lastY =
        event.clientY

    }
  )


renderer.domElement
  .addEventListener(
    "pointermove",
    event => {

      if (!dragging)
        return

      yaw -=
        (
          event.clientX -
          lastX
        ) * 0.008

      pitch +=
        (
          event.clientY -
          lastY
        ) * 0.008

      pitch =
        Math.max(
          0.15,
          Math.min(
            1.35,
            pitch
          )
        )

      lastX =
        event.clientX

      lastY =
        event.clientY

      updateCamera()

    }
  )


renderer.domElement
  .addEventListener(
    "pointerup",
    () => {

      dragging = false

    }
  )


renderer.domElement
  .addEventListener(
    "wheel",
    event => {

      event.preventDefault()

      cameraDistance +=
        event.deltaY * 0.01

      cameraDistance =
        Math.max(
          4,
          Math.min(
            30,
            cameraDistance
          )
        )

      updateCamera()

    },
    {
      passive: false
    }
  )


updateCamera()


/* =========================================
   LIGHT
========================================= */

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x444444,
    2
  )
)


/* =========================================
   FLOOR
========================================= */

const floor =
  new THREE.Mesh(

    new THREE.PlaneGeometry(
      18,
      14
    ),

    new THREE.MeshStandardMaterial({
      color: 0x292d34,
      roughness: 1
    })

  )

floor.rotation.x =
  -Math.PI / 2

scene.add(
  floor
)


/* =========================================
   GRID
========================================= */

const grid =
  new THREE.GridHelper(
    18,
    36,
    0x555b66,
    0x30343b
  )

scene.add(
  grid
)


/* =========================================
   ROUTE
========================================= */

const route = [

  new THREE.Vector3(
    -4,
    0,
    4
  ),

  new THREE.Vector3(
    -2.8,
    0,
    3.5
  ),

  new THREE.Vector3(
    -1.6,
    0,
    3
  ),

  new THREE.Vector3(
    -0.4,
    0,
    2.7
  ),

  new THREE.Vector3(
    0.8,
    0,
    2.1
  ),

  new THREE.Vector3(
    1.7,
    0,
    1.2
  ),

  new THREE.Vector3(
    2.5,
    0,
    0.3
  )

]


/* =========================================
   NAVIGATION GROUP
========================================= */

const navigationGroup =
  new THREE.Group()

scene.add(
  navigationGroup
)


/* =========================================
   SETTINGS
========================================= */

const GROUND_Y =
  0.025

const SIDE_WIDTH =
  0.28

const ARROW_SPACING =
  0.65

const PURPLE =
  0x8b7cff


/* =========================================
   CREATE SIDE BORDER
========================================= */

function createBorder(
  points
) {

  const geometry =
    new THREE.BufferGeometry()
      .setFromPoints(
        points
      )

  const material =
    new THREE.LineBasicMaterial({

      color:
        PURPLE,

      transparent:
        true,

      opacity:
        0.75,

      depthWrite:
        false

    })

  const line =
    new THREE.Line(
      geometry,
      material
    )

  line.position.y =
    GROUND_Y

  navigationGroup.add(
    line
  )

}


/* =========================================
   CREATE TWO BORDERS
========================================= */

function createBorders() {

  const left = []

  const right = []

  for (
    let i = 0;
    i < route.length;
    i++
  ) {

    let direction

    if (
      i === 0
    ) {

      direction =
        new THREE.Vector3()
          .subVectors(
            route[1],
            route[0]
          )
          .normalize()

    }

    else if (
      i === route.length - 1
    ) {

      direction =
        new THREE.Vector3()
          .subVectors(
            route[i],
            route[i - 1]
          )
          .normalize()

    }

    else {

      const previous =
        new THREE.Vector3()
          .subVectors(
            route[i],
            route[i - 1]
          )
          .normalize()

      const next =
        new THREE.Vector3()
          .subVectors(
            route[i + 1],
            route[i]
          )
          .normalize()

      direction =
        previous
          .add(next)
          .normalize()

    }


    const perpendicular =
      new THREE.Vector3(
        -direction.z,
        0,
        direction.x
      ).normalize()


    const leftPoint =
      route[i]
        .clone()
        .add(
          perpendicular
            .clone()
            .multiplyScalar(
              SIDE_WIDTH
            )
        )

    const rightPoint =
      route[i]
        .clone()
        .add(
          perpendicular
            .clone()
            .multiplyScalar(
              -SIDE_WIDTH
            )
        )


    leftPoint.y =
      GROUND_Y

    rightPoint.y =
      GROUND_Y


    left.push(
      leftPoint
    )

    right.push(
      rightPoint
    )

  }


  createBorder(
    left
  )

  createBorder(
    right
  )

}


createBorders()


/* =========================================
   ROUTE LENGTH
========================================= */

function getRouteLength() {

  let length = 0

  for (
    let i = 0;
    i < route.length - 1;
    i++
  ) {

    length +=
      route[i]
        .distanceTo(
          route[i + 1]
        )

  }

  return length
}


/* =========================================
   POINT ON ROUTE
========================================= */

function getPointAtDistance(
  distance
) {

  let remaining =
    distance

  for (
    let i = 0;
    i < route.length - 1;
    i++
  ) {

    const start =
      route[i]

    const end =
      route[i + 1]

    const length =
      start.distanceTo(
        end
      )

    if (
      remaining <= length
    ) {

      const direction =
        new THREE.Vector3()
          .subVectors(
            end,
            start
          )
          .normalize()


      const position =
        start
          .clone()
          .add(
            direction
              .clone()
              .multiplyScalar(
                remaining
              )
          )


      position.y =
        GROUND_Y


      const angle =
        Math.atan2(
          direction.x,
          direction.z
        )


      return {
        position,
        angle
      }

    }

    remaining -=
      length

  }

  return null

}


/* =========================================
   CREATE CHEVRON
========================================= */

function createChevron() {

  const group =
    new THREE.Group()


  const width =
    0.22

  const length =
    0.28


  const points = [

    new THREE.Vector3(
      -width,
      0,
      length * 0.35
    ),

    new THREE.Vector3(
      0,
      0,
      -length * 0.35
    ),

    new THREE.Vector3(
      width,
      0,
      length * 0.35
    )

  ]


  const geometry =
    new THREE.BufferGeometry()
      .setFromPoints(
        points
      )


  const material =
    new THREE.LineBasicMaterial({

      color:
        PURPLE,

      transparent:
        true,

      opacity:
        0.95,

      depthWrite:
        false

    })


  const line =
    new THREE.Line(
      geometry,
      material
    )


  /*
   * Ground-level.
   */
  line.position.y =
    0.012


  group.add(
    line
  )


  return group

}


/* =========================================
   CREATE ARROWS
========================================= */

const arrows = []

const totalLength =
  getRouteLength()

const arrowCount =
  Math.floor(
    totalLength /
      ARROW_SPACING
  )


for (
  let i = 0;
  i < arrowCount;
  i++
) {

  const distance =
    (
      i + 0.5
    ) *
    ARROW_SPACING


  const point =
    getPointAtDistance(
      distance
    )


  if (!point)
    continue


  const arrow =
    createChevron()


  arrow.position.copy(
    point.position
  )


  /*
   * Arrow points toward
   * destination.
   */
  arrow.rotation.y =
    point.angle


  arrow.userData.phase =
    i * 0.55


  navigationGroup.add(
    arrow
  )


  arrows.push(
    arrow
  )

}


/* =========================================
   DESTINATION
========================================= */

const destination =
  route[
    route.length - 1
  ]


const destinationRing =
  new THREE.Mesh(

    new THREE.RingGeometry(
      0.35,
      0.43,
      48
    ),

    new THREE.MeshBasicMaterial({

      color:
        0x8b7cff,

      transparent:
        true,

      opacity:
        0.9,

      side:
        THREE.DoubleSide

    })

  )


destinationRing.rotation.x =
  -Math.PI / 2


destinationRing.position.copy(
  destination
)

destinationRing.position.y =
  GROUND_Y


scene.add(
  destinationRing
)


/* =========================================
   ANIMATION
========================================= */

const clock =
  new THREE.Clock()


function animate(time) {

  requestAnimationFrame(
    animate
  )


  const elapsed =
    clock.getElapsedTime()


  /*
   * Chevron animation.
   *
   * Notice:
   *
   * NO Y MOVEMENT.
   */
  arrows.forEach(
    (arrow, index) => {

      const phase =
        elapsed * 2.2 +
        index * 0.55


      const pulse =
        0.86 +
        Math.sin(
          phase
        ) * 0.14


      arrow.scale.set(
        pulse,
        pulse,
        pulse
      )


      const line =
        arrow.children[0]


      const material =
        line.material


      material.opacity =
        0.35 +
        (
          0.6 *
          (
            (
              Math.sin(
                phase
              ) + 1
            ) / 2
          )
        )

    }
  )


  /*
   * Destination pulse.
   */
  const destinationPulse =
    1 +
    Math.sin(
      elapsed * 3
    ) * 0.12


  destinationRing.scale.set(
    destinationPulse,
    destinationPulse,
    destinationPulse
  )


  destinationRing.material.opacity =
    0.45 +
    (
      (
        Math.sin(
          elapsed * 3
        ) + 1
      ) / 2
    ) * 0.4


  renderer.render(
    scene,
    camera
  )

}


animate()


/* =========================================
   RESET
========================================= */

document
  .getElementById("reset")
  .onclick = () => {

    arrows.forEach(
      arrow => {

        arrow.scale.set(
          1,
          1,
          1
        )

      }
    )

  }


/* =========================================
   RESIZE
========================================= */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight

    camera.updateProjectionMatrix()

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    )

  }
)

</script>

</body>

</html>
